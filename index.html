  {t:"题型", k:"typ", c:[
   "五种情形算期望：一维离散/连续、函数离散/连续、二维离散",
   "线性性质拆项：E(aX+bY+c)",
   "独立时用 E(XY)、D(X±Y) 简化",
   "D(X) 与 EX² 互求",
   "识别常见分布查表+性质求线性组合期望方差"]}]}
]}
]};

function build(node, level, branchKey){
  if(typeof node==='string')node={t:node};
  const li=document.createElement('li');
  li.className='node lv'+level+(node.k?' '+node.k:'');
  const hasKids=node.c&&node.c.length;
  const row=document.createElement('div');row.className='row';
  const tw=document.createElement('span');tw.className='tw'+(hasKids?'':' leaf');tw.textContent='▶';
  row.appendChild(tw);
  const tt=document.createElement('div');tt.className='nt';
  if(node.ji){const j=document.createElement('span');j.className='ji';j.textContent='第'+node.ji+'记';tt.appendChild(j);}
  if(node.tag){const s=document.createElement('span');s.className='chip sec';s.style.marginRight='8px';s.textContent=node.tag;tt.appendChild(s);}
  tt.appendChild(document.createTextNode(node.ji?node.t.replace(/^第\d+记 · /,''):node.t));
  if(hasKids&&level>=2){const cn=document.createElement('span');cn.className='cnt';cn.textContent='('+node.c.length+')';tt.appendChild(cn);}
  row.appendChild(tt);
  li.appendChild(row);
  if(hasKids){
    const ul=document.createElement('ul');ul.className='kids';
    node.c.forEach(ch=>{
      const child=build(ch,level+1,node.k||branchKey);
      if(node.k)child.classList.add(node.k+'-branch');
      ul.appendChild(child);
    });
    li.appendChild(ul);
    row.addEventListener('click',()=>{li.classList.toggle('collapsed');tw.classList.toggle('open');});
    li.classList.add('collapsed');
  }else{
    li.classList.add('leaf');
    if(branchKey)li.classList.add(branchKey+'-branch');
    const dot=document.createElement('span');dot.className='dot';row.insertBefore(dot,tw);
    tw.remove();
  }
  return li;
}
const tree=document.getElementById('tree');
const ul=document.createElement('ul');
ul.appendChild(build(DATA,0));
tree.appendChild(ul);
const root=ul.firstChild;root.classList.remove('collapsed');root.querySelector('.tw').classList.add('open');

function setAll(open){
  document.querySelectorAll('.node').forEach(n=>{
    if(n.querySelector('.kids')){n.classList.toggle('collapsed',!open);const t=n.querySelector('.tw');if(t)t.classList.toggle('open',open);}
  });
}
function setLevel(lv){
  document.querySelectorAll('.node').forEach(n=>{
    const m=n.className.match(/lv(\d)/);if(!m)return;
    const l=+m[1];const open=l<lv;
    if(n.querySelector('.kids')){n.classList.toggle('collapsed',!open);const t=n.querySelector('.tw');if(t)t.classList.toggle('open',open);}
  });
}
setLevel(3);
</script>
